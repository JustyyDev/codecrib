<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CodeCrib Herhalen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=IBM+Plex+Mono:wght@400;600&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html"><img src="assets/logo.svg" alt="" /><span data-i18n="brand">CodeCrib</span></a>
    <button type="button" class="menu-toggle" aria-expanded="false" data-i18n="menu">Menu</button>
    <nav class="nav">
      <a href="index.html" data-nav="home" data-i18n="nav_home">Home</a>
      <a href="index.html#courses" data-nav="course" data-i18n="nav_course">Cursussen</a>
      <a href="exam.html" data-nav="exam" data-i18n="nav_exam">Proefexamen</a>
      <a href="playground.html" data-nav="play" data-i18n="nav_play">Playground</a>
      <a href="certificate.html" data-nav="cert" data-i18n="nav_cert">Certificaat</a>
      <a href="review.html" data-nav="review" data-i18n="nav_review">Herhalen</a>
      <button type="button" class="lang-btn" data-lang="nl">NL</button>
      <button type="button" class="lang-btn" data-lang="en">EN</button>
    </nav>
  </header>
  <main>
    <section class="hero">
      <h1 data-i18n="review_title"></h1>
      <p class="tagline" data-i18n="review_intro"></p>
      <span class="pill" id="due-pill">0</span>
    </section>
    <div id="empty" class="callout" hidden data-i18n="review_empty"></div>
    <div class="quiz" id="review-quiz"></div>
  </main>
  <footer class="site-footer">
    <div data-i18n="footer"></div>
    <div class="tiny" data-i18n="footer_note"></div>
  </footer>
  <script src="js/i18n.js"></script>
  <script src="js/srs.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/app.js"></script>
  <script>
    function paint() {
      const due = CodeCribSrs.dueCards();
      document.getElementById("due-pill").textContent = CodeCribI18n.t("review_due") + ": " + due.length;
      const empty = document.getElementById("empty");
      const host = document.getElementById("review-quiz");
      host.innerHTML = "";
      if (!due.length) { empty.hidden = false; return; }
      empty.hidden = true;
      // show up to 20 due cards
      due.slice(0, 20).forEach((card, i) => {
        const item = card.meta.q;
        if (!item) return;
        const wrap = document.createElement("div");
        wrap.className = "card challenge-card";
        const meta = document.createElement("div");
        meta.className = "pill";
        meta.textContent = (card.meta.courseId || "?") + " · " + CodeCribI18n.t("review_box") + " " + card.box;
        wrap.appendChild(meta);
        const inner = document.createElement("div");
        inner.className = "quiz";
        wrap.appendChild(inner);
        host.appendChild(wrap);
        CodeCribQuiz.renderOne(inner, item, i, {
          lang: CodeCribI18n.getLang(),
          srs: {
            courseId: card.meta.courseId,
            lessonId: card.meta.lessonId,
            qIndex: card.meta.qIndex,
            source: card.meta.source || "review"
          },
          onAnswer: () => {
            // refresh counts after a beat
            setTimeout(paint, 400);
          }
        });
      });
    }
    document.addEventListener("DOMContentLoaded", paint);
    document.addEventListener("codecrib:lang", paint);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#c2185b" />
  <title>CodeCrib exam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=IBM+Plex+Mono:wght@400;600&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html"><img src="assets/logo.svg" alt="" /><span data-i18n="brand">CodeCrib</span></a>
    <button type="button" class="menu-toggle" aria-expanded="false" data-i18n="menu">Menu</button>
    <nav class="nav">
      <a href="index.html" data-nav="home" data-i18n="nav_home">Home</a>
      <a href="index.html#courses" data-nav="course" data-i18n="nav_course">Cursussen</a>
      <a href="exam.html" data-nav="exam" data-i18n="nav_exam">Proefexamen</a>
      <a href="playground.html" data-nav="play" data-i18n="nav_play">Playground</a>
      <a href="certificate.html" data-nav="cert" data-i18n="nav_cert">Certificaat</a>
      <a href="review.html" data-nav="review" data-i18n="nav_review">Herhalen</a>
      <button type="button" class="lang-btn" data-lang="nl">NL</button>
      <button type="button" class="lang-btn" data-lang="en">EN</button>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1 id="exam-title" data-i18n="exam_title"></h1>
      <p class="tagline" id="exam-intro" data-i18n="exam_intro"></p>
      <div class="hero-actions">
        <button type="button" class="btn" id="submit" data-i18n="submit_exam"></button>
        <button type="button" class="btn secondary" id="again" data-i18n="again"></button>
        <a class="btn ghost" id="course-link" href="course.html"></a>
      </div>
    </section>
    <div id="score-box" class="score-box" hidden>
      <div data-i18n="your_score"></div>
      <div class="big" id="score-num">0/0</div>
    </div>
    <div class="quiz" id="exam"></div>
  </main>

  <footer class="site-footer">
    <div data-i18n="footer">made by JustyTCCD</div>
    <div class="tiny" data-i18n="footer_note"></div>
  </footer>

  <script src="js/i18n.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/courses-registry.js"></script>
  <script src="js/course-utils.js"></script>
  <script src="js/srs.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/app.js"></script>
  <script>
    let COURSE=null, ctrl=null;
    async function boot(){ COURSE=await CodeCribUtil.ensureCourse(CodeCribUtil.courseId()); renderExam(); }
    function renderExam(){
      const L=CodeCribI18n.getLang();
      document.getElementById("exam-title").textContent=CodeCribI18n.t("exam_title")+": "+COURSE.title[L];
      document.getElementById("course-link").href="course.html?course="+COURSE.id;
      document.getElementById("course-link").textContent=COURSE.title[L];
      document.getElementById("score-box").hidden=true;
      const take = COURSE.examDraw || 20;
      ctrl=CodeCribQuiz.renderExam(document.getElementById("exam"), COURSE.exam, L, true, take, { courseId: COURSE.id, source: "exam" });
      document.title="CodeCrib - "+COURSE.title[L]+" exam";
    }
    document.addEventListener("DOMContentLoaded",()=>{
      boot().catch(console.error);
      document.getElementById("submit").addEventListener("click",()=>{
        if(!ctrl) return;
        const r=ctrl.score();
        CodeCribProgress.saveExam(COURSE.id, r.score, r.total);
        ctrl.reveal(r);
        const box=document.getElementById("score-box");
        box.hidden=false;
        document.getElementById("score-num").textContent=r.score+"/"+r.total+" ("+Math.round(r.score/r.total*100)+"%)";
        box.scrollIntoView({behavior:"smooth",block:"center"});
      });
      document.getElementById("again").addEventListener("click",()=>{ if(COURSE) renderExam(); });
    });
    document.addEventListener("codecrib:lang",()=>{ if(COURSE) renderExam(); });
  </script>
</body></html>

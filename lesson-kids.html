<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#2d6a4f" />
  <meta name="description" content="CodeCrib Junior: rustige Python-lessen voor kinderen." />
  <title>CodeCrib Junior</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600&family=IBM+Plex+Mono:wght@400;600&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/kids.css" />
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
</head>
<body class="kids-page">
  <header class="site-header">
    <a class="brand" href="index.html"><img src="assets/logo.svg" alt="" /><span data-i18n="brand">CodeCrib</span></a>
    <button type="button" class="menu-toggle" aria-expanded="false" data-i18n="menu">Menu</button>
    <nav class="nav">
      <a href="index.html" data-nav="home" data-i18n="nav_home">Home</a>
      <a href="kids.html">Junior</a>
      <a href="kids-projects.html">Mijn projecten</a>
      <a href="index.html#courses" data-nav="course" data-i18n="nav_course">Cursussen</a>
      <a href="exam.html" data-nav="exam" data-i18n="nav_exam">Proefexamen</a>
      <a href="playground.html" data-nav="play" data-i18n="nav_play">Playground</a>
      <a href="certificate.html" data-nav="cert" data-i18n="nav_cert">Certificaat</a>
      <a href="review.html" data-nav="review" data-i18n="nav_review">Herhalen</a>
      <button type="button" class="lang-btn" data-lang="nl">NL</button>
      <button type="button" class="lang-btn" data-lang="en">EN</button>
    </nav>
  </header>

  <main>
    <p><a id="back-link" href="course.html" data-i18n="back_course"></a></p>
    <div id="kids-root"></div>
  </main>

  <footer class="site-footer">
    <div data-i18n="footer">made by JustyTCCD</div>
    <div class="tiny" data-i18n="footer_note"></div>
  </footer>

  <script src="js/i18n.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/courses-registry.js"></script>
  <script src="js/course-utils.js"></script>
  <script src="js/srs.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/kids-settings.js"></script>
  <script src="js/kids-profiles.js"></script>
  <script src="js/kids-progress.js"></script>
  <script src="js/kids-fx.js"></script>
  <script src="js/kids-lesson.js"></script>
  <script src="js/runtime/runners.js"></script>
  <script src="js/runtime/editor.js"></script>
  <script src="js/app.js"></script>
  <script>
    let COURSE = null, LES = null;
    async function boot() {
      const cid = CodeCribUtil.courseId();
      COURSE = await CodeCribUtil.ensureCourse(cid);
      if (!COURSE.kids && !(CodeCribUtil.meta(cid) || {}).kids) {
        location.replace("lesson.html?course=" + encodeURIComponent(cid) + "&id=" + (CodeCribUtil.param("id", "1")));
        return;
      }
      const id = parseInt(CodeCribUtil.param("id", "1"), 10) || 1;
      LES = COURSE.lessons.find((x) => x.id === id) || COURSE.lessons[0];
      document.getElementById("back-link").href = "course.html?course=" + COURSE.id;
      document.title = "CodeCrib Junior - " + LES.title[CodeCribI18n.getLang()];
      await CodeCribKidsLesson.render({ course: COURSE, lesson: LES, root: document.getElementById("kids-root") });
    }
    document.addEventListener("DOMContentLoaded", () => boot().catch(console.error));
    document.addEventListener("codecrib:lang", () => { if (COURSE && LES) boot().catch(console.error); });
  </script>
</body>
</html>

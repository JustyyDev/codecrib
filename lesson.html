<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#c2185b" />
  <meta name="description" content="CodeCrib: free coding lessons with live editor, challenges and certificates." />
  <title>CodeCrib lesson</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=IBM+Plex+Mono:wght@400;600&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html"><img src="assets/logo.svg" alt="" /><span data-i18n="brand">CodeCrib</span></a>
    <button type="button" class="menu-toggle" aria-expanded="false" data-i18n="menu">Menu</button>
    <nav class="nav">
      <a href="index.html" data-nav="home" data-i18n="nav_home">Home</a>
      <a href="index.html#courses" data-nav="course" data-i18n="nav_course">Cursussen</a>
      <a href="exam.html" data-nav="exam" data-i18n="nav_exam">Proefexamen</a>
      <a href="playground.html" data-nav="play" data-i18n="nav_play">Playground</a>
      <a href="certificate.html" data-nav="cert" data-i18n="nav_cert">Certificaat</a>
      <a href="review.html" data-nav="review" data-i18n="nav_review">Herhalen</a>
      <button type="button" class="lang-btn" data-lang="nl">NL</button>
      <button type="button" class="lang-btn" data-lang="en">EN</button>
    </nav>
  </header>

  <main>
    <p><a id="back-link" href="course.html" data-i18n="back_course"></a></p>
    <article class="content card" id="lesson-body"></article>
    <h2 data-i18n="exercise" id="ex-title" hidden></h2>
    <p id="ex-instructions" class="tagline" hidden></p>
    <div id="editor-host" hidden></div>
    <h2 data-i18n="quiz_title"></h2>
    <div class="quiz" id="quiz"></div>
    <h2 data-i18n="recap_title" id="recap-title" hidden></h2>
    <p class="tagline" id="recap-intro" hidden data-i18n="recap_intro"></p>
    <div class="quiz" id="recap"></div>
    <div class="lesson-nav">
      <a class="btn ghost" id="prev-link" href="#">←</a>
      <button type="button" class="btn secondary" id="mark-done" data-i18n="mark_done"></button>
      <a class="btn" id="next-link" href="#">→</a>
    </div>
  </main>

  <footer class="site-footer">
    <div data-i18n="footer">made by JustyTCCD</div>
    <div class="tiny" data-i18n="footer_note"></div>
  </footer>

  <script src="js/i18n.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/courses-registry.js"></script>
  <script src="js/course-utils.js"></script>
  <script src="js/srs.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/runtime/runners.js"></script>
  <script src="js/runtime/editor.js"></script>
  <script src="js/app.js"></script>
  <script>
    let COURSE=null, LES=null, editor=null;
    async function boot(){
      const cid0 = CodeCribUtil.courseId();
      COURSE = await CodeCribUtil.ensureCourse(cid0);
      if (COURSE.kids || (CodeCribUtil.meta(cid0)||{}).kids) {
        location.replace("lesson-kids.html?course="+encodeURIComponent(cid0)+"&id="+(CodeCribUtil.param("id","1")));
        return;
      }
      const id = parseInt(CodeCribUtil.param("id","1"),10)||1;
      LES = COURSE.lessons.find(x=>x.id===id) || COURSE.lessons[0];
      await render();
    }
    async function render(){
      const L=CodeCribI18n.getLang(); const cid=COURSE.id;
      document.getElementById("back-link").href="course.html?course="+cid;
      document.title="CodeCrib - "+LES.title[L];
      document.getElementById("lesson-body").innerHTML="<h1>"+CodeCribI18n.t("lesson")+" "+LES.id+": "+LES.title[L]+"</h1>"+LES.body[L];
      CodeCribQuiz.renderQuiz(document.getElementById("quiz"), LES.quiz, L, { courseId: cid, lessonId: LES.id, source: "lesson" });
      // Mixed recap from earlier lessons
      const recapTitle = document.getElementById("recap-title");
      const recapIntro = document.getElementById("recap-intro");
      const recapHost = document.getElementById("recap");
      recapHost.innerHTML = "";
      const earlier = COURSE.lessons.filter((x) => x.id < LES.id);
      if (earlier.length) {
        recapTitle.hidden = false; recapIntro.hidden = false;
        let pool = [];
        earlier.forEach((les) => {
          (les.quiz || []).forEach((q, qi) => pool.push(Object.assign({}, q, { _bankIndex: les.id * 1000 + qi, _fromLesson: les.id })));
        });
        pool = CodeCribQuiz.shuffle(pool).slice(0, Math.min(8, pool.length));
        pool.forEach((q) => {
          CodeCribQuiz.renderOne(recapHost, q, recapHost.children.length, {
            lang: L,
            srs: { courseId: cid, lessonId: q._fromLesson, qIndex: q._bankIndex, source: "recap" }
          });
        });
      } else {
        recapTitle.hidden = true; recapIntro.hidden = true;
      }
      const host=document.getElementById("editor-host");
      const exTitle=document.getElementById("ex-title");
      const exInst=document.getElementById("ex-instructions");
      if (LES.exercise){
        exTitle.hidden=false; exInst.hidden=false; host.hidden=false;
        exInst.textContent=LES.exercise.instructions[L];
        host.innerHTML="";
        editor = await CodeCribEditor.mount(host, {
          lang: LES.exercise.lang,
          langLabel: LES.exercise.lang,
          value: LES.exercise.starter || "",
          expected: LES.exercise.expected,
          tests: LES.exercise.tests,
          preview: !!LES.exercise.preview,
          runLabel: CodeCribI18n.t("run_check")
        });
      } else {
        exTitle.hidden=true; exInst.hidden=true; host.hidden=true; host.innerHTML="";
      }
      const prev=COURSE.lessons.find(x=>x.id===LES.id-1);
      const next=COURSE.lessons.find(x=>x.id===LES.id+1);
      const prevLink=document.getElementById("prev-link");
      const nextLink=document.getElementById("next-link");
      if(prev){prevLink.href="lesson.html?course="+cid+"&id="+prev.id; prevLink.textContent="<- "+CodeCribI18n.t("prev"); prevLink.style.visibility="visible";}
      else prevLink.style.visibility="hidden";
      if(next){nextLink.href="lesson.html?course="+cid+"&id="+next.id; nextLink.textContent=CodeCribI18n.t("next")+" ->";}
      else {nextLink.href="course.html?course="+cid; nextLink.textContent=CodeCribI18n.t("challenges")+" ->";}
      const mark=document.getElementById("mark-done");
      mark.textContent=CodeCribProgress.isDone(cid,LES.id)?CodeCribI18n.t("done"):CodeCribI18n.t("mark_done");
      mark.onclick=()=>{CodeCribProgress.markLesson(cid,LES.id); mark.textContent=CodeCribI18n.t("done");};
    }
    document.addEventListener("DOMContentLoaded",()=>boot().catch(console.error));
    document.addEventListener("codecrib:lang",()=>{ if(COURSE&&LES) render(); });
  </script>
</body></html>
